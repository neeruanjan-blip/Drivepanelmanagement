<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Drive & Panel Management</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; background: #f8fafc; color: #1e293b; }
    .fade-in { animation: fadeIn 0.2s ease; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:none; } }
    @keyframes spin { to { transform:rotate(360deg); } }
    .sidebar-link { display:flex; align-items:center; gap:12px; width:100%; padding:10px 12px; border-radius:8px; color:#cbd5e1; font-size:14px; border:none; background:none; cursor:pointer; text-align:left; transition:background 0.15s,color 0.15s; }
    .sidebar-link:hover { background:#334155; color:#fff; }
    .sidebar-link.active { background:#1e40af; color:#fff; }
    .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.4); z-index:1000; align-items:center; justify-content:center; padding:16px; backdrop-filter:blur(2px); }
    .modal-overlay.open { display:flex; }
    input, select, textarea { font-family:inherit; }
    .table-wrap { overflow-x:auto; }
    table { width:100%; border-collapse:collapse; font-size:14px; }
    th { text-align:left; padding:10px 16px; font-size:11px; font-weight:600; letter-spacing:0.05em; text-transform:uppercase; color:#64748b; background:#f8fafc; border-bottom:1px solid #e2e8f0; white-space:nowrap; }
    td { padding:10px 16px; border-bottom:1px solid #f1f5f9; vertical-align:middle; }
    tr:last-child td { border-bottom:none; }
    tr:hover td { background:#f8fafc; }
    .badge { display:inline-flex; align-items:center; padding:2px 10px; border-radius:999px; font-size:11px; font-weight:600; white-space:nowrap; }
    .btn-primary { background:#1d4ed8; color:#fff; border:none; padding:8px 16px; border-radius:8px; font-size:13px; font-weight:600; cursor:pointer; transition:background 0.15s; }
    .btn-primary:hover { background:#1e40af; }
    .btn-ghost { background:none; border:1px solid #e2e8f0; padding:8px 16px; border-radius:8px; font-size:13px; cursor:pointer; color:#475569; transition:background 0.15s; }
    .btn-ghost:hover { background:#f1f5f9; }
    .form-input { width:100%; border:1px solid #cbd5e1; border-radius:8px; padding:8px 12px; font-size:13px; outline:none; transition:border 0.15s; background:#fff; }
    .form-input:focus { border-color:#3b82f6; box-shadow:0 0 0 3px rgba(59,130,246,0.1); }
    .form-label { display:block; font-size:12px; font-weight:600; color:#475569; margin-bottom:4px; }
    .card { background:#fff; border:1px solid #e2e8f0; border-radius:12px; overflow:hidden; }
    .stat-card { background:#fff; border:1px solid #e2e8f0; border-radius:12px; padding:20px; }
  </style>
</head>
